<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Inscripción | Instituto Nuevo Cuyo</title>
    <meta name="description" content="Formulario de pre-inscripción para aspirantes del Instituto Nuevo Cuyo.">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <div class="form-wrapper">
            <header class="form-header">
                <div class="logo">INC</div>
                <h1>Instituto Nuevo Cuyo</h1>
                <p>Sistema de Pre-Inscripción Institucional</p>
            </header>

            <form action="procesar.php" method="POST" id="inscriptionForm">
                <div class="form-section">
                    <h2>Datos Personales</h2>
                    <div class="input-group">
                        <label for="nombre">Nombre Completo *</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                    </div>
                    
                    <div class="input-row">
                        <div class="input-group">
                            <label for="dni">DNI (Sin puntos) *</label>
                            <input type="text" id="dni" name="dni" required pattern="[0-9]+" placeholder="Ej. 12345678">
                        </div>
                        <div class="input-group">
                            <label for="fecha_nacimiento">Fecha de Nacimiento *</label>
                            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="correo">Correo Electrónico *</label>
                        <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                    </div>
                </div>

                <div class="form-section">
                    <h2>Datos Académicos</h2>
                    <div class="input-group">
                        <label for="carrera">Carrera a la que se inscribe *</label>
                        <select id="carrera" name="carrera" required>
                            <option value="" disabled selected>Seleccione una carrera...</option>
                            <option value="Tecnicatura Superior en Programación">Tecnicatura Superior en Programación</option>
                            <option value="Tecnicatura Superior en Desarrollo de Software">Tecnicatura Superior en Desarrollo de Software</option>
                            <option value="Analista de Sistemas">Analista de Sistemas</option>
                            <option value="Licenciatura en Sistemas">Licenciatura en Sistemas</option>
                        </select>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="titulo_secundario" name="titulo_secundario" required>
                        <label for="titulo_secundario">Confirmo que poseo el título secundario completo o certificado de título en trámite. *</label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Completar Pre-Inscripción</button>
            </form>
        </div>
    </main>
</body>
</html>
